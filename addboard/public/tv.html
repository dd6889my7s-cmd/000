<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>addboard</title>
<style>
  :root {
    --bg: #050505;
    --panel: #121212;
    --line: #272727;
    --text: #e6e6e6;
    --dim: #8a8a8a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2.2vh 2vw;
    gap: 1.6vh;
    cursor: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2vw;
    margin-bottom: 4.5vh; /* ヘッダー下に1行ぶんの余白 */
  }
  #clock { font-size: 4.6vh; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }

  /* 朝会メモ(ヘッダー中央・背景なし) */
  #note {
    flex: 1;
    text-align: center;
    font-size: 2.8vh;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 8vh;
    overflow: hidden;
  }

  #cols { display: flex; gap: 1.4vw; flex: 1; min-height: 0; position: relative; }
  .member {
    flex: 1;
    padding: 1.6vh 1.4vw;
    display: flex;
    flex-direction: column;
    gap: 1.2vh;
    overflow: hidden;
  }
  .member h2 {
    font-size: 2.3vh;
    font-weight: normal;
    text-align: center;
    color: var(--mc);
  }

  /* 二人共通の予定(左右の列の下部に重ねて中央表示・背景なし) */
  #shared {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 1vh;
    display: none;
  }
  #shared.show { display: block; }
  #shared ul { display: flex; flex-direction: column; align-items: center; }
  .member .todos { border-top: 1px solid var(--line); padding-top: 1.2vh; }
  ul { list-style: none; overflow: hidden; }
  li { font-size: 5.8vh; line-height: 1.5; display: flex; align-items: baseline; gap: .5em; color: var(--mc); }
  li .time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.2em; }
  li .time.allday { opacity: .55; font-size: .75em; }
  li.todo::before { content: "☐"; opacity: .7; }
  li.todo.done::before { content: "☑"; }
  li.todo.done { opacity: .45; text-decoration: line-through; }
  li.empty { color: var(--dim); font-size: 3vh; }
  li.empty::before { content: none; }

  #week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: .8vw;
    height: 16vh;
  }
  .day {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 1.2vh;
    padding: 1vh .6vw;
    overflow: hidden;
  }
  .day.today { border-color: var(--text); }
  .day .dhead { font-size: 1.9vh; font-weight: 700; color: var(--dim); margin-bottom: .5vh; }
  .day.today .dhead { color: var(--text); }
  .day li { font-size: 1.9vh; line-height: 1.5; display: block; word-break: break-word; margin-bottom: .3vh; }
  #offline { position: fixed; top: 1vh; right: 1vw; color: var(--dim); font-size: 2vh; display: none; }
</style>
</head>
<body>
  <header>
    <div id="note"></div>
    <div id="clock"></div>
  </header>
  <div id="cols"></div>
  <div id="week"></div>
  <div id="offline">接続が切れています…再接続中</div>

<script>
const YOUBI = ['日','月','火','水','木','金','土'];
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
}
setInterval(tickClock, 1000);
tickClock();

let lastRenderedDay = dstr(new Date());
setInterval(() => {
  // 日付が変わったら自動で表示を今日基準に更新する
  if (dstr(new Date()) !== lastRenderedDay) load();
}, 30000);

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function evLi(e) {
  return `<li>${e.time
    ? `<span class="time">${esc(e.time)}</span>`
    : '<span class="time allday">終日</span>'}<span>${esc(e.title)}</span></li>`;
}
function tdLi(t) {
  return `<li class="todo${t.done ? ' done' : ''}">${esc(t.text)}</li>`;
}

function render(b) {
  const today = dstr(new Date());
  lastRenderedDay = today;
  const colorOf = id => (b.members.find(m => m.id === id) || {}).color || '#e6e6e6';

  // 朝会メモ(ヘッダー中央)
  document.getElementById('note').textContent = (b.note && b.note.text) || '';

  // 各自の「今日」(左右の列・本人の色)
  const cols = document.getElementById('cols');
  const memberHtml = b.members.filter(m => m.id !== 'both').map(mem => {
    const evs = b.events.filter(e => e.memberId === mem.id && e.date === today);
    const todos = b.todos.filter(t => t.memberId === mem.id && (!t.date || t.date <= today));
    const evHtml = evs.length ? evs.map(evLi).join('') : '<li class="empty">予定なし</li>';
    const tdHtml = todos.length ? `<ul class="todos">${todos.map(tdLi).join('')}</ul>` : '';
    return `<div class="member" style="--mc:${esc(mem.color)}">
      <h2>${esc(mem.name)}</h2>
      <ul>${evHtml}</ul>${tdHtml}
    </div>`;
  }).join('');

  // 二人共通(左右の列の下部に重ねて中央・水色)
  const shEvs = b.events.filter(e => e.memberId === 'both' && e.date === today);
  const shTds = b.todos.filter(t => t.memberId === 'both' && (!t.date || t.date <= today));
  const sharedHtml = (shEvs.length || shTds.length)
    ? `<div id="shared" class="show"><ul style="--mc:${esc(colorOf('both'))}">${shEvs.map(evLi).join('')}${shTds.map(tdLi).join('')}</ul></div>`
    : '';

  cols.innerHTML = memberHtml + sharedHtml;

  // 今後1週間(文字色で誰の予定か区別)
  const week = document.getElementById('week');
  week.innerHTML = [...Array(7)].map((_, i) => {
    const d = new Date(Date.now() + i * 86400000);
    const ds = dstr(d);
    const evs = b.events.filter(e => e.date === ds);
    return `<div class="day${i === 0 ? ' today' : ''}">
      <div class="dhead">${i === 0 ? '今日' : `${d.getMonth()+1}/${d.getDate()}`}(${YOUBI[d.getDay()]})</div>
      <ul>${evs.map(e => `<li style="--mc:${esc(colorOf(e.memberId))}">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}</li>`).join('')}</ul>
    </div>`;
  }).join('');
}

async function load() {
  const r = await fetch('/api/board');
  render(await r.json());
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = () => { load().catch(() => {}); document.getElementById('offline').style.display = 'none'; };
  es.onerror = () => {
    document.getElementById('offline').style.display = 'block';
    es.close();
    setTimeout(connect, 3000);
  };
}
load().catch(() => {});
connect();
</script>
</body>
</html>
